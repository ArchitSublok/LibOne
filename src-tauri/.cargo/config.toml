# LibOne – Cargo build configuration for Windows (D: drive self-contained).
# Uses:
#   - lld-link.exe from system LLVM (C:\Program Files\LLVM\bin\lld-link.exe)
#   - xwin-splatted Windows CRT + SDK libraries from D:\.xwin
#   - clang-cl.exe from system LLVM (C:\Program Files\LLVM\bin\clang-cl.exe)
#   - Windows-bundled winsqlite3.lib from D:\.xwin\sqlite_local

[build]
target-dir = "D:\\LibOne\\.cargo-target"

[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files\\LLVM\\bin\\lld-link.exe"

[env]
PATH = "D:\\.xwin\\bin;C:\\Program Files\\LLVM\\bin"
# Windows SDK and CRT library search paths for the MSVC linker
LIB = "D:\\.xwin\\crt\\lib\\x86_64;D:\\.xwin\\sdk\\lib\\um\\x86_64;D:\\.xwin\\sdk\\lib\\ucrt\\x86_64;D:\\.xwin\\sqlite_local"

# Windows SDK headers for C/C++ build scripts (e.g. vswhom-sys)
INCLUDE = "D:\\.xwin\\crt\\include;D:\\.xwin\\sdk\\include\\um;D:\\.xwin\\sdk\\include\\ucrt;D:\\.xwin\\sdk\\include\\shared"

# Point cc-rs at clang-cl for C/C++ compilation
CXX_x86_64_pc_windows_msvc = "C:\\Program Files\\LLVM\\bin\\clang-cl.exe"
CC_x86_64_pc_windows_msvc  = "C:\\Program Files\\LLVM\\bin\\clang-cl.exe"
RC_x86_64_pc_windows_msvc  = "C:\\Program Files\\LLVM\\bin\\llvm-rc.exe"
RC                         = "C:\\Program Files\\LLVM\\bin\\llvm-rc.exe"

# SQLite pre-built library
SQLITE3_LIB_DIR     = "D:\\.xwin\\sqlite_local"
SQLITE3_INCLUDE_DIR = "D:\\.xwin\\sqlite_local"
